[project]
name = "zdssl"
version = "0.1.0"
description = "Zero-day self-supervised tabular model for CSE-CIC-IDS2018 (Paper 1)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "xgboost",
    "torch",
    "pyyaml",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zdssl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
